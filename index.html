  /* ---- tokens: light vellum is the default ground ---- */
  :root {
    --paper: #EEEFEA;
    --panel: #F8F8F4;
    --line: #D7D8D0;
    --line-strong: #B7B9AF;
    --ink: #171A16;
    --muted: #5E6459;
    --accent: #D9531C;
    --accent-soft: rgba(217, 83, 28, 0.13);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #14161A;
      --panel: #1B1E22;
      --line: #2A2E33;
      --line-strong: #3B4147;
      --ink: #ECEEE8;
      --muted: #8B9188;
      --accent: #FF7A3D;
      --accent-soft: rgba(255, 122, 61, 0.18);
    }
  }
  :root[data-theme="light"] {
    --paper: #EEEFEA;
    --panel: #F8F8F4;
    --line: #D7D8D0;
    --line-strong: #B7B9AF;
    --ink: #171A16;
    --muted: #5E6459;
    --accent: #D9531C;
    --accent-soft: rgba(217, 83, 28, 0.13);
  }
  :root[data-theme="dark"] {
    --paper: #14161A;
    --panel: #1B1E22;
    --line: #2A2E33;
    --line-strong: #3B4147;
    --ink: #ECEEE8;
    --muted: #8B9188;
    --accent: #FF7A3D;
    --accent-soft: rgba(255, 122, 61, 0.18);
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .sheet {
    min-height: 100svh;
    max-width: 1120px;
    margin-inline: auto;
    padding: clamp(1.1rem, 3vw, 2.25rem);
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: clamp(1.75rem, 5vh, 3.25rem);
  }

  /* ---- title-block rails ---- */
  .rail {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1.25rem;
    flex-wrap: wrap;
    font-family: "Field", ui-monospace, monospace;
    font-size: 0.6875rem;
    letter-spacing: 0.09em;
    color: var(--muted);
  }
  .rail--top { padding-bottom: 0.85rem; border-bottom: 1px solid var(--line); }
  .rail--btm { padding-top: 0.85rem; border-top: 1px solid var(--line); justify-content: center; }

  .wordmark {
    font-family: "Nameplate", system-ui, sans-serif;
    font-weight: 700;
    font-size: 0.8125rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .rail__meta { display: inline-flex; align-items: center; gap: 0.55rem; text-transform: uppercase; }

  .lamp {
    inline-size: 6px; block-size: 6px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
    opacity: 0.4;
    transition: opacity 1.1s ease 0.15s;
  }
  .is-on .lamp { opacity: 1; animation: breathe 5s ease-in-out 1.4s infinite; }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.65; } }

  /* ---- stage ---- */
  .stage {
    display: grid;
    grid-template-columns: minmax(0, 1.12fr) minmax(0, 0.88fr);
    align-items: center;
    gap: clamp(2rem, 6vw, 4rem);
  }
  @media (max-width: 860px) {
    .stage { grid-template-columns: minmax(0, 1fr); gap: 2.25rem; }
  }

  .copy { display: flex; flex-direction: column; align-items: flex-start; gap: 1.1rem; }

  .title {
    font-family: "Nameplate", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(3.4rem, 10.5vw, 5.75rem);
    line-height: 0.92;
    letter-spacing: -0.01em;
    text-wrap: balance;
    color: var(--ink);
    margin: -0.2rem 0 0;
  }

  .status {
    font-family: "Field", ui-monospace, monospace;
    font-size: 0.9375rem;

  /* ---- figure ---- */

  .panel {

  .obj--after { stroke: var(--ink); stroke-width: 1.75; }

  .ring { fill: none; stroke: var(--accent); stroke-width: 1.75; vector-effect: non-scaling-stroke; }

  .arrow-fill { fill: var(--accent); }

  /* ---- power-on sequence ---- */

  .is-on .fade { opacity: 1; transform: none; transition: opacity 0.8s ease, transform 0.8s cubic-bezier(.2,.7,.3,1); }
  .is-on .d1 { transition-delay: 0.15s; }

  .panel { opacity: 0; transition: opacity 0.9s ease 0.3s; }
  .is-on .panel { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {

    .lamp, .is-on .lamp { opacity: 1; animation: none; transition: none; }
    .contact, .is-on .contact { opacity: 1; animation: none; }
  }
